<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8faff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" fill="url(#bg)"/>

  <!-- Background modern dot grid pattern -->
  <g opacity="0.18">
    <circle cx="0" cy="0" r="1.2" fill="#ffffff"/>
    <circle cx="32" cy="0" r="1.2" fill="#ffffff"/>
    <circle cx="64" cy="0" r="1.2" fill="#ffffff"/>
    <circle cx="96" cy="0" r="1.2" fill="#ffffff"/>
    <circle cx="128" cy="0" r="1.2" fill="#ffffff"/>
    <circle cx="160" cy="0" r="1.2" fill="#ffffff"/>
    <circle cx="192" cy="0" r="1.2" fill="#ffffff"/>
    <circle cx="224" cy="0" r="1.2" fill="#ffffff"/>
    <circle cx="256" cy="0" r="1.2" fill="#ffffff"/>
    <circle cx="16" cy="32" r="1.2" fill="#ffffff"/>
    <circle cx="48" cy="32" r="1.2" fill="#ffffff"/>
    <circle cx="80" cy="32" r="1.2" fill="#ffffff"/>
    <circle cx="112" cy="32" r="1.2" fill="#ffffff"/>
    <circle cx="144" cy="32" r="1.2" fill="#ffffff"/>
    <circle cx="176" cy="32" r="1.2" fill="#ffffff"/>
    <circle cx="208" cy="32" r="1.2" fill="#ffffff"/>
    <circle cx="240" cy="32" r="1.2" fill="#ffffff"/>
    <circle cx="0" cy="64" r="1.2" fill="#ffffff"/>
    <circle cx="32" cy="64" r="1.2" fill="#ffffff"/>
    <circle cx="64" cy="64" r="1.2" fill="#ffffff"/>
    <circle cx="96" cy="64" r="1.2" fill="#ffffff"/>
    <circle cx="128" cy="64" r="1.2" fill="#ffffff"/>
    <circle cx="160" cy="64" r="1.2" fill="#ffffff"/>
    <circle cx="192" cy="64" r="1.2" fill="#ffffff"/>
    <circle cx="224" cy="64" r="1.2" fill="#ffffff"/>
    <circle cx="256" cy="64" r="1.2" fill="#ffffff"/>
    <circle cx="16" cy="96" r="1.2" fill="#ffffff"/>
    <circle cx="48" cy="96" r="1.2" fill="#ffffff"/>
    <circle cx="80" cy="96" r="1.2" fill="#ffffff"/>
    <circle cx="112" cy="96" r="1.2" fill="#ffffff"/>
    <circle cx="144" cy="96" r="1.2" fill="#ffffff"/>
    <circle cx="176" cy="96" r="1.2" fill="#ffffff"/>
    <circle cx="208" cy="96" r="1.2" fill="#ffffff"/>
    <circle cx="240" cy="96" r="1.2" fill="#ffffff"/>
    <circle cx="0" cy="128" r="1.2" fill="#ffffff"/>
    <circle cx="32" cy="128" r="1.2" fill="#ffffff"/>
    <circle cx="64" cy="128" r="1.2" fill="#ffffff"/>
    <circle cx="96" cy="128" r="1.2" fill="#ffffff"/>
    <circle cx="128" cy="128" r="1.2" fill="#ffffff"/>
    <circle cx="160" cy="128" r="1.2" fill="#ffffff"/>
    <circle cx="192" cy="128" r="1.2" fill="#ffffff"/>
    <circle cx="224" cy="128" r="1.2" fill="#ffffff"/>
    <circle cx="256" cy="128" r="1.2" fill="#ffffff"/>
    <circle cx="16" cy="160" r="1.2" fill="#ffffff"/>
    <circle cx="48" cy="160" r="1.2" fill="#ffffff"/>
    <circle cx="80" cy="160" r="1.2" fill="#ffffff"/>
    <circle cx="112" cy="160" r="1.2" fill="#ffffff"/>
    <circle cx="144" cy="160" r="1.2" fill="#ffffff"/>
    <circle cx="176" cy="160" r="1.2" fill="#ffffff"/>
    <circle cx="208" cy="160" r="1.2" fill="#ffffff"/>
    <circle cx="240" cy="160" r="1.2" fill="#ffffff"/>
    <circle cx="0" cy="192" r="1.2" fill="#ffffff"/>
    <circle cx="32" cy="192" r="1.2" fill="#ffffff"/>
    <circle cx="64" cy="192" r="1.2" fill="#ffffff"/>
    <circle cx="96" cy="192" r="1.2" fill="#ffffff"/>
    <circle cx="128" cy="192" r="1.2" fill="#ffffff"/>
    <circle cx="160" cy="192" r="1.2" fill="#ffffff"/>
    <circle cx="192" cy="192" r="1.2" fill="#ffffff"/>
    <circle cx="224" cy="192" r="1.2" fill="#ffffff"/>
    <circle cx="256" cy="192" r="1.2" fill="#ffffff"/>
    <circle cx="16" cy="224" r="1.2" fill="#ffffff"/>
    <circle cx="48" cy="224" r="1.2" fill="#ffffff"/>
    <circle cx="80" cy="224" r="1.2" fill="#ffffff"/>
    <circle cx="112" cy="224" r="1.2" fill="#ffffff"/>
    <circle cx="144" cy="224" r="1.2" fill="#ffffff"/>
    <circle cx="176" cy="224" r="1.2" fill="#ffffff"/>
    <circle cx="208" cy="224" r="1.2" fill="#ffffff"/>
    <circle cx="240" cy="224" r="1.2" fill="#ffffff"/>
    <circle cx="0" cy="256" r="1.2" fill="#ffffff"/>
    <circle cx="32" cy="256" r="1.2" fill="#ffffff"/>
    <circle cx="64" cy="256" r="1.2" fill="#ffffff"/>
    <circle cx="96" cy="256" r="1.2" fill="#ffffff"/>
    <circle cx="128" cy="256" r="1.2" fill="#ffffff"/>
    <circle cx="160" cy="256" r="1.2" fill="#ffffff"/>
    <circle cx="192" cy="256" r="1.2" fill="#ffffff"/>
    <circle cx="224" cy="256" r="1.2" fill="#ffffff"/>
    <circle cx="256" cy="256" r="1.2" fill="#ffffff"/>
  </g>

  <!-- Floating clock face -->
  <circle cx="128" cy="92" r="48" fill="#ffffff" filter="url(#shadow)"/>

  <!-- Clock face subtle gradient ring -->
  <circle cx="128" cy="92" r="46" fill="none" stroke="url(#ring)" stroke-width="1.8" opacity="0.15"/>

  <!-- Clock hour markers -->
  <circle cx="128" cy="54" r="2.4" fill="#6366f1" opacity="0.35"/>
  <circle cx="128" cy="130" r="2.4" fill="#6366f1" opacity="0.35"/>
  <circle cx="90" cy="92" r="2.4" fill="#6366f1" opacity="0.35"/>
  <circle cx="166" cy="92" r="2.4" fill="#6366f1" opacity="0.35"/>
  <circle cx="101.5" cy="65.5" r="1.6" fill="#6366f1" opacity="0.2"/>
  <circle cx="154.5" cy="65.5" r="1.6" fill="#6366f1" opacity="0.2"/>
  <circle cx="101.5" cy="118.5" r="1.6" fill="#6366f1" opacity="0.2"/>
  <circle cx="154.5" cy="118.5" r="1.6" fill="#6366f1" opacity="0.2"/>

  <!-- Clock hands: hour -->
  <path d="M128 92 L124 82" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
  <!-- Clock hands: minute -->
  <path d="M128 92 L140 78" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
  <!-- Clock center -->
  <circle cx="128" cy="92" r="3.2" fill="#6366f1"/>

  <!-- Status pill -->
  <rect x="96" y="154" width="64" height="26" rx="13" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="96" y="154" width="64" height="26" rx="13" fill="#22d3ee" opacity="0.08"/>
  <circle cx="110" cy="167" r="3.8" fill="url(#accent)"/>
  <rect x="118" y="162" width="36" height="6" rx="3" fill="#6366f1" opacity="0.75"/>

  <!-- Bottom row: 3 modern task pills -->
  <!-- Pill 1: green completed -->
  <rect x="58" y="196" width="44" height="22" rx="11" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="70" cy="207" r="4" fill="#22c55e"/>
  <path d="M68 207 L69.5 208.5 L72 205.5" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="78" y="202" width="18" height="5" rx="2.5" fill="#1f2937" opacity="0.35"/>

  <!-- Pill 2: orange in progress -->
  <rect x="106" y="196" width="44" height="22" rx="11" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="118" cy="207" r="4" fill="#f59e0b"/>
  <path d="M116 207 L117.5 208.5 L120 205.5" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="126" y="202" width="18" height="5" rx="2.5" fill="#1f2937" opacity="0.35"/>

  <!-- Pill 3: red urgent -->
  <rect x="154" y="196" width="44" height="22" rx="11" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="166" cy="207" r="4" fill="#ef4444"/>
  <path d="M164 207 L165.5 208.5 L168 205.5" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="174" y="202" width="18" height="5" rx="2.5" fill="#1f2937" opacity="0.35"/>

  <!-- Schedule bar accent -->
  <rect x="58" y="182" width="140" height="3" rx="1.5" fill="#ffffff" opacity="0.25"/>
  <rect x="58" y="182" width="80" height="3" rx="1.5" fill="url(#accent)" opacity="0.7"/>

  <!-- Floating add button -->
  <circle cx="190" cy="188" r="17" fill="url(#accent)"/>
  <circle cx="190" cy="188" r="13" fill="#ffffff" opacity="0.15"/>
  <path d="M190 183 L190 193 M185 188 L195 188" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
</svg>
